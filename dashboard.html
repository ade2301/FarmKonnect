<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net https://unpkg.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' https://cdn.jsdelivr.net data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" />
    <meta name="referrer" content="no-referrer" />
    <title>Dashboard - FarmKonnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="dashboard">
    <header>
        <nav class="navbar navbar-expand-lg" aria-label="Primary">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                    <img src="assets/logo.png" alt="FarmKonnect logo" width="36" height="36" class="rounded-circle object-fit-cover" />
                    <span class="fw-bold brand-text">FarmKonnect</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#primaryNav" aria-controls="primaryNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="primaryNav">
                    <ul class="navbar-nav site-nav-links mb-2 mb-lg-0 align-items-lg-center">
                        <li class="nav-item"><button type="button" class="btn btn-gold btn-sm" data-action="logout">Logout</button></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main id="dashboardApp">
        <section class="py-5 section-light-green dashboard-shell">
            <div class="container">
                <div class="text-center py-5" data-dashboard-loading>
                    <div class="spinner-border text-ojaya" role="status" aria-label="Loading dashboard"></div>
                    <p class="text-secondary mt-3 mb-0">Loading your workspace...</p>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/marketplace.js"></script>
</body>
</html>
