<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Farmer Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        :root {
            --green: #238a2a;
            --light-green: #eef6f0;
            --gray: #777;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--light-green);
        }

        header {
            background: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--green);
            margin: 0;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
        }

        aside {
            background: white;
            border-radius: 12px;
            padding: 20px;
            height: fit-content;
        }

        aside a {
            display: block;
            padding: 10px 12px;
            color: #333;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        aside a.active,
        aside a:hover {
            background: var(--green);
            color: white;
        }

        main {
            background: white;
            border-radius: 12px;
            padding: 20px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: var(--light-green);
            border-radius: 12px;
            padding: 20px;
        }

        .card h3 {
            margin: 0;
            color: var(--green);
        }

        .card p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            color: var(--gray);
        }

        form label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        form input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        .btn {
            margin-top: 20px;
            background: var(--green);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.85rem;
            color: var(--gray);
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>FarmKonnect — Farmer Dashboard</h1>
        <span>👨‍🌾 Welcome, Farmer</span>
    </header>

    <div class="container">
        <aside>
            <a href="#" class="active">Dashboard</a>
            <a href="#">My Products</a>
            <a href="#">Orders</a>
            <a href="#">Profile</a>
            <a href="#">Logout</a>
        </aside>

        <main>
            <section class="cards">
                <div class="card">
                    <h3>12</h3>
                    <p>Products Listed</p>
                </div>
                <div class="card">
                    <h3>5</h3>
                    <p>Active Orders</p>
                </div>
                <div class="card">
                    <h3>₦120,000</h3>
                    <p>Total Earnings</p>
                </div>
            </section>

            <section>
                <h2>Edit Farm Profile</h2>

                <form>
                    <label>Full Name</label>
                    <input type="text" value="John Doe" />

                    <label>Email</label>
                    <input type="email" value="farmer@email.com" disabled />

                    <label>Farm Type</label>
                    <input type="text" value="Vegetables & Poultry" />

                    <button class="btn">Upload Products</button>
                </form>
            </section>
        </main>
    </div>

    <footer>
        © FarmKonnect <span id="year"></span>
    </footer>


    <script>
        const startYear = 2025;
        const currentYear = new Date().getFullYear();
        document.getElementById("year").textContent =
            startYear === currentYear ? currentYear : `${startYear} – ${currentYear}`;
    </script>

</body>

</html>
